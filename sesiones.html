<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Sesiones | Sergio Ricardo Molina</title>
  <link href="https://lh3.googleusercontent.com/d/1A6PFi2lpp_VNhnmtTYGkYXyjMZ1p8LhA" rel="icon" type="image/png">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111111;
      color: #ffffff;
      padding: 20px 16px 40px;
      max-width: 960px;
      margin: 0 auto;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #282828;
    }
    .btn-volver {
      background: #222222;
      color: #ffffff;
      border: 1px solid #005580;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-volver:hover {
      background: #2f2f2f;
      border-color: #38bdf8;
    }
    .titulo-categoria {
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .titulo-subcarpeta {
      font-size: 1rem;
      font-weight: 500;
      color: #38bdf8;
      margin: 26px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #222;
      padding-bottom: 6px;
    }
    .galeria {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 600px) {
      .galeria { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    }
    @media (min-width: 768px) {
      .galeria { grid-template-columns: repeat(4, 1fr); gap: 12px; }
    }
    .card-foto {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .card-foto:hover {
      transform: scale(1.02);
      border-color: #0077b3;
    }
    .card-foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .badge-likes-thumb {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(18, 18, 18, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffffff;
      z-index: 5;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .badge-likes-thumb:hover {
      background: rgba(0, 85, 128, 0.85);
      border-color: #38bdf8;
    }
    .badge-likes-thumb.liked {
      background: rgba(225, 29, 72, 0.25);
      border-color: #fb7185;
      color: #fb7185;
    }
    .badge-likes-thumb .material-symbols-outlined {
      font-size: 14px;
    }
    .badge-likes-thumb.liked .material-symbols-outlined {
      font-variation-settings: 'FILL' 1;
      color: #f43f5e;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-contenido {
      position: relative;
      max-width: 92%;
      max-height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .modal img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .firma-visor {
      position: absolute;
      bottom: 12px;
      left: 14px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
      color: #e0e0e0;
      font-family: monospace;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 1002;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .firma-visor .dot { color: #38bdf8; }
    .btn-like-visor {
      position: absolute;
      bottom: 20px;
      right: 24px;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 8px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      z-index: 1003;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      user-select: none;
    }
    .btn-like-visor:hover {
      background: rgba(0, 85, 128, 0.9);
      border-color: #38bdf8;
      transform: scale(1.05);
    }
    .btn-like-visor.liked {
      background: rgba(225, 29, 72, 0.35);
      border-color: #fb7185;
      color: #fb7185;
    }
    .btn-like-visor .material-symbols-outlined {
      font-size: 18px;
    }
    .btn-like-visor.liked .material-symbols-outlined {
      font-variation-settings: 'FILL' 1;
      color: #f43f5e;
    }
    .btn-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 2.2rem;
      padding: 14px 20px;
      cursor: pointer;
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      user-select: none;
      z-index: 1001;
      border: 1px solid rgba(255,255,255,0.15);
      transition: background 0.2s;
    }
    .btn-nav:hover { background: rgba(0,85,128,0.7); }
    .btn-prev { left: 16px; }
    .btn-next { right: 16px; }
    .btn-cerrar {
      position: absolute;
      top: 20px;
      right: 24px;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      z-index: 1004;
      padding: 4px 14px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .redes-sociales {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 40px;
    }
    .btn-red {
      background: #222222;
      border-radius: 12px;
      padding: 14px 6px;
      text-align: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.2s;
    }
    .btn-red:active { transform: scale(0.96); }
    .btn-wsp { border: 2px solid #4ade80; color: #4ade80; }
    .btn-cat { border: 2px solid #facc15; color: #facc15; }
    .btn-ig  { border: 2px solid #fb923c; color: #fb923c; }
    footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #222222;
      color: #666666;
      font-size: 0.8rem;
    }
    @media (max-width: 600px) { .btn-nav { display: none; } }
  </style>
</head>
<body oncontextmenu="return false;">
  <header>
    <a href="index.html" class="btn-volver">← Volver al Portafolio</a>
    <h2 class="titulo-categoria">
      <span class="material-symbols-outlined" style="color: #38bdf8;">photo_camera</span>
      <span>Sesiones</span>
    </h2>
  </header>

  <main id="contenedor-secciones">
    <div style="text-align:center; padding: 60px 0; color: #888;">
      <div style="width: 32px; height: 32px; border: 2px solid #005580; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px;"></div>
      Cargando fotografías desde Google Drive...
    </div>
  </main>

  <div class="redes-sociales">
    <a class="btn-red btn-wsp" href="https://wa.me/542613175222" target="_blank" rel="noopener noreferrer">
      <span class="material-symbols-outlined">chat</span>
      <span>WhatsApp</span>
    </a>
    <a class="btn-red btn-cat" href="https://wa.me/c/5492613175222" target="_blank" rel="noopener noreferrer">
      <span class="material-symbols-outlined">inventory_2</span>
      <span>Catálogo</span>
    </a>
    <a class="btn-red btn-ig" href="https://www.instagram.com/sergioricardo.molina?igsi=OG84bTUxanllMnh4" target="_blank" rel="noopener noreferrer">
      <span class="material-symbols-outlined">photo_camera_back</span>
      <span>Instagram</span>
    </a>
  </div>

  <footer>
    <p>© Sergio Ricardo Molina · Fotografía Profesional · Mendoza, Argentina</p>
  </footer>

  <div class="modal" id="modal" onclick="cerrarVisorFondo(event)">
    <span class="btn-cerrar" onclick="cerrarVisor()">×</span>
    <span class="btn-nav btn-prev" onclick="cambiarFoto(-1, event)">❮</span>
    <div class="modal-contenido" onclick="event.stopPropagation()">
      <img id="img-ampliada" src="" alt="Sesiones Sergio Molina">
      <div class="firma-visor" id="firma-visor">
        <span>Sergio Molina</span>
        <span class="dot">•</span>
        <span id="firma-subcarpeta">Sesiones</span>
        <span class="dot">•</span>
        <span id="firma-archivo">#foto.jpg</span>
      </div>
    </div>
    <button class="btn-like-visor" id="btn-like-visor" onclick="toggleCorazonVisor(event)" type="button">
      <span class="material-symbols-outlined" id="ico-like-visor">favorite</span>
      <span id="txt-like-visor">0</span>
    </button>
    <span class="btn-nav btn-next" onclick="cambiarFoto(1, event)">❯</span>
  </div>

  <script>
    const API_KEY = 'AIzaSyAHNvLODt54qLomj14TUPbQyo-KJ_HO4ZM';
    const FOLDER_ID = '1IReNcUgPTRAa9nj3-u38QstyZWV9n6RY';
    const NOMBRE_SECCION = 'Sesiones';

    const SUPABASE_URL = 'https://zbixojacwvanucxlrdcd.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaXhvamFjd3ZhbnVjeGxyZGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzgxMzQsImV4cCI6MjEwNDExNDEzNH0.Wz35IGTGzdHuHOm2EbTsGSLBZfhw67Wt7UXBbMXek68';

    const supabase = (window.supabase && typeof window.supabase.createClient === 'function')
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    function getFingerprint() {
      let fp = localStorage.getItem('user_fingerprint');
      if (!fp) {
        fp = 'fp_' + Math.random().toString(36).substring(2, 12) + '_' + Date.now();
        localStorage.setItem('user_fingerprint', fp);
      }
      return fp;
    }
    const HUELLA_USUARIO = getFingerprint();

    let fotosActuales = [];
    let indiceFotoActual = 0;
    let votosLocales = JSON.parse(localStorage.getItem('votos_sesiones') || '{}');
    let likesMemoria = {};

    async function cargarLikesDesdeSupabase() {
      if (!supabase) return;
      try {
        const { data, error } = await supabase
          .from('likes_fotos')
          .select('foto_id, conteo')
          .eq('galeria', 'sesiones');
        if (!error && data) {
          data.forEach(item => { likesMemoria[item.foto_id] = item.conteo; });
          actualizarTodosLosBadges();
        }
      } catch (_) {}
    }

    async function toggleLikeFoto(fotoId, fotoNombre, e) {
      if (e) { e.stopPropagation(); e.preventDefault(); }
      const yaVoto = !!votosLocales[fotoId];
      const conteoActual = likesMemoria[fotoId] || 0;
      const nuevoConteo = yaVoto ? Math.max(0, conteoActual - 1) : conteoActual + 1;

      likesMemoria[fotoId] = nuevoConteo;
      if (yaVoto) delete votosLocales[fotoId];
      else votosLocales[fotoId] = true;
      localStorage.setItem('votos_sesiones', JSON.stringify(votosLocales));

      actualizarBadgeFoto(fotoId, nuevoConteo, !yaVoto);
      if (fotosActuales[indiceFotoActual] && fotosActuales[indiceFotoActual].id === fotoId) {
        actualizarBotonVisor(nuevoConteo, !yaVoto);
      }

      if (supabase) {
        try {
          const { data } = await supabase.rpc('toggle_corazon', {
            p_foto_id: fotoId,
            p_foto_nombre: fotoNombre || 'foto.jpg',
            p_galeria: 'sesiones',
            p_huella: HUELLA_USUARIO
          });
          if (data) {
            likesMemoria[fotoId] = data.total;
            if (data.liked) votosLocales[fotoId] = true;
            else delete votosLocales[fotoId];
            localStorage.setItem('votos_sesiones', JSON.stringify(votosLocales));
            actualizarBadgeFoto(fotoId, data.total, data.liked);
            if (fotosActuales[indiceFotoActual] && fotosActuales[indiceFotoActual].id === fotoId) {
              actualizarBotonVisor(data.total, data.liked);
            }
          }
        } catch (_) {}
      }
    }

    function toggleCorazonVisor(e) {
      if (!fotosActuales[indiceFotoActual]) return;
      const f = fotosActuales[indiceFotoActual];
      toggleLikeFoto(f.id, f.name, e);
    }

    function actualizarBadgeFoto(fotoId, conteo, isLiked) {
      const badge = document.getElementById('badge-like-' + fotoId);
      const txt = document.getElementById('txt-like-' + fotoId);
      if (txt) txt.textContent = conteo;
      if (badge) {
        if (isLiked) badge.classList.add('liked');
        else badge.classList.remove('liked');
      }
    }

    function actualizarTodosLosBadges() {
      Object.keys(likesMemoria).forEach(fotoId => {
        actualizarBadgeFoto(fotoId, likesMemoria[fotoId], !!votosLocales[fotoId]);
      });
    }

    function actualizarBotonVisor(conteo, isLiked) {
      const btn = document.getElementById('btn-like-visor');
      const txt = document.getElementById('txt-like-visor');
      if (txt) txt.textContent = conteo;
      if (btn) {
        if (isLiked) btn.classList.add('liked');
        else btn.classList.remove('liked');
      }
    }

    async function cargarSubcarpetas() {
      const contenedor = document.getElementById('contenedor-secciones');
      const urlFolders = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType='application/vnd.google-apps.folder'+and+trashed=false&orderBy=name&key=${API_KEY}&fields=files(id,name)`;
      try {
        const res = await fetch(urlFolders);
        const data = await res.json();
        if (data.files && data.files.length > 0) {
          contenedor.innerHTML = '';
          for (const sub of data.files) {
            await renderizarSubcarpeta(sub.id, sub.name);
          }
        } else {
          await renderizarFotosDirectas(FOLDER_ID, NOMBRE_SECCION);
        }
      } catch (err) {
        await renderizarFotosDirectas(FOLDER_ID, NOMBRE_SECCION);
      }
      try { cargarLikesDesdeSupabase(); } catch(_) {}
    }

    async function renderizarSubcarpeta(subId, subNombre) {
      const contenedor = document.getElementById('contenedor-secciones');
      const urlFiles = `https://www.googleapis.com/drive/v3/files?q='${subId}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&orderBy=name&key=${API_KEY}&fields=files(id,name)`;
      try {
        const res = await fetch(urlFiles);
        const data = await res.json();
        if (data.files && data.files.length > 0) {
          const seccion = document.createElement('section');
          seccion.innerHTML = `
            <h3 class="titulo-subcarpeta">
              <span class="material-symbols-outlined" style="font-size: 20px;">folder</span>
              <span>${subNombre}</span>
            </h3>
            <div class="galeria" id="galeria-${subId}"></div>
          `;
          contenedor.appendChild(seccion);
          const grid = seccion.querySelector('#galeria-' + subId);
          data.files.forEach(f => {
            const urlHD = `https://lh3.googleusercontent.com/d/${f.id}=w1600`;
            const indexGlobal = fotosActuales.length;
            fotosActuales.push({ id: f.id, url: urlHD, name: f.name || 'foto.jpg', subcarpeta: subNombre });
            const card = document.createElement('div');
            card.className = 'card-foto';
            const conteo = likesMemoria[f.id] || 0;
            const liked = !!votosLocales[f.id];
            card.innerHTML = `
              <img src="https://lh3.googleusercontent.com/d/${f.id}=w800" alt="${f.name}" loading="lazy">
              <button class="badge-likes-thumb ${liked ? 'liked' : ''}" id="badge-like-${f.id}" onclick="toggleLikeFoto('${f.id}', '${f.name}', event)" type="button">
                <span class="material-symbols-outlined">favorite</span>
                <span id="txt-like-${f.id}">${conteo}</span>
              </button>
            `;
            card.onclick = () => abrirVisor(indexGlobal);
            grid.appendChild(card);
          });
        }
      } catch (_) {}
    }

    async function renderizarFotosDirectas(folderId, nombreCarpeta) {
      const contenedor = document.getElementById('contenedor-secciones');
      const urlFiles = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&orderBy=name&key=${API_KEY}&fields=files(id,name)`;
      try {
        const res = await fetch(urlFiles);
        const data = await res.json();
        if (data.files && data.files.length > 0) {
          contenedor.innerHTML = '<div class="galeria" id="galeria-directa"></div>';
          const grid = document.getElementById('galeria-directa');
          data.files.forEach(f => {
            const urlHD = `https://lh3.googleusercontent.com/d/${f.id}=w1600`;
            const indexGlobal = fotosActuales.length;
            fotosActuales.push({ id: f.id, url: urlHD, name: f.name || 'foto.jpg', subcarpeta: nombreCarpeta });
            const card = document.createElement('div');
            card.className = 'card-foto';
            const conteo = likesMemoria[f.id] || 0;
            const liked = !!votosLocales[f.id];
            card.innerHTML = `
              <img src="https://lh3.googleusercontent.com/d/${f.id}=w800" alt="${f.name}" loading="lazy">
              <button class="badge-likes-thumb ${liked ? 'liked' : ''}" id="badge-like-${f.id}" onclick="toggleLikeFoto('${f.id}', '${f.name}', event)" type="button">
                <span class="material-symbols-outlined">favorite</span>
                <span id="txt-like-${f.id}">${conteo}</span>
              </button>
            `;
            card.onclick = () => abrirVisor(indexGlobal);
            grid.appendChild(card);
          });
        }
      } catch (_) {}
    }

    function abrirVisor(index) {
      indiceFotoActual = index;
      const foto = fotosActuales[indiceFotoActual];
      if (!foto) return;
      document.getElementById('img-ampliada').src = foto.url;
      document.getElementById('firma-subcarpeta').innerText = foto.subcarpeta || NOMBRE_SECCION;
      document.getElementById('firma-archivo').innerText = '#' + foto.name;
      const conteo = likesMemoria[foto.id] || 0;
      const liked = !!votosLocales[foto.id];
      actualizarBotonVisor(conteo, liked);
      document.getElementById('modal').style.display = 'flex';
      registrarMetrica('foto_visor_hd', `Foto: #${foto.name} en ${foto.subcarpeta}`);
    }

    function cerrarVisor() { document.getElementById('modal').style.display = 'none'; }
    function cerrarVisorFondo(e) { if (e.target.id === 'modal') cerrarVisor(); }
    function cambiarFoto(dir, event) {
      if (event) event.stopPropagation();
      indiceFotoActual += dir;
      if (indiceFotoActual >= fotosActuales.length) indiceFotoActual = 0;
      else if (indiceFotoActual < 0) indiceFotoActual = fotosActuales.length - 1;
      const foto = fotosActuales[indiceFotoActual];
      if (foto) {
        document.getElementById('img-ampliada').src = foto.url;
        document.getElementById('firma-subcarpeta').innerText = foto.subcarpeta || NOMBRE_SECCION;
        document.getElementById('firma-archivo').innerText = '#' + foto.name;
        const conteo = likesMemoria[foto.id] || 0;
        const liked = !!votosLocales[foto.id];
        actualizarBotonVisor(conteo, liked);
      }
    }

    document.addEventListener('keydown', e => {
      const m = document.getElementById('modal');
      if (m && m.style.display === 'flex') {
        if (e.key === 'Escape') cerrarVisor();
        else if (e.key === 'ArrowLeft') cambiarFoto(-1);
        else if (e.key === 'ArrowRight') cambiarFoto(1);
      }
    });

    let touchStartX = 0;
    const modalEl = document.getElementById('modal');
    modalEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, false);
    modalEl.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX + 50 < touchStartX) cambiarFoto(1);
      else if (touchEndX > touchStartX + 50) cambiarFoto(-1);
    }, false);

    async function registrarMetrica(tipo, detalle) {
      try {
        if (window.supabase) {
          const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          await client.from('visitas').insert([{ tipo, pagina: 'sesiones.html', detalle, dispositivo: window.innerWidth < 640 ? 'mobile' : 'desktop' }]);
        }
      } catch (_) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarSubcarpetas();
      registrarMetrica('visita_pagina', 'Visita a galería Sesiones');
    });
  </script>
</body>
</html>
