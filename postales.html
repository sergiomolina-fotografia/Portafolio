<script>
// 1. Exclusión voluntaria solo si el usuario pasa ?sergio=1 explícito
(function detectarTokenMaestro() {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('sergio') === '1' || urlParams.get('admin') === '1' || urlParams.get('ignorar') === '1') {
      localStorage.setItem('dispositivo_token', 'sergio_molina_master_device');
      localStorage.setItem('ignorar_visita', 'true');
      urlParams.delete('sergio');
      urlParams.delete('admin');
      urlParams.delete('ignorar');
      const nuevaQuery = urlParams.toString();
      const nuevaUrl = window.location.pathname + (nuevaQuery ? '?' + nuevaQuery : '') + window.location.hash;
      window.history.replaceState({}, document.title, nuevaUrl);
      console.log('🛡️ Dispositivo marcado como propio.');
    }
  } catch (_) {}
})();

// 2. Credenciales oficiales de Supabase y Google Drive
const SUPABASE_URL = 'https://zbixojacwvanucxlrdcd.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaXhvamFjd3ZhbnVjeGxyZGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzgxMzQsImV4cCI6MjEwNDExNDEzNH0.Wz35IGTGzdHuHOm2EbTsGSLBZfhw67Wt7UXBbMXek68';
const API_KEY_DRIVE = 'AIzaSyAHNvLODt54qLomj14TUPbQyo-KJ_HO4ZM';
const FOLDER_ID_GALERIA = '1W-eFu0G6mqggGw6TN7bSU9Dvz0k2h70M';

const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

function obtenerHuellaNavegador() {
  let huella = localStorage.getItem('usuario_huella_voto');
  if (!huella) {
    huella = 'usr_' + Math.random().toString(36).substring(2, 12) + '_' + Date.now().toString(36);
    localStorage.setItem('usuario_huella_voto', huella);
  }
  return huella;
}
const HUELLA_USUARIO = obtenerHuellaNavegador();

const likesCache = new Map();
const misVotosCache = new Set();
let fotosActuales = [];
let indiceFotoActual = 0;

async function sincronizarLikesDeGaleria() {
  if (!supabaseClient) return;
  try {
    const { data: totales } = await supabaseClient
      .from('likes_fotos')
      .select('foto_id, conteo')
      .eq('galeria', 'postales');
    if (totales && totales.length > 0) {
      totales.forEach(item => {
        likesCache.set(item.foto_id, item.conteo || 0);
      });
    }

    const { data: misVotos } = await supabaseClient
      .from('votos_corazones')
      .select('foto_id')
      .eq('dispositivo_huella', HUELLA_USUARIO);
    if (misVotos && misVotos.length > 0) {
      misVotos.forEach(item => misVotosCache.add(item.foto_id));
    }
    actualizarTodosLosBotonesDeLikes();
  } catch (err) {
    console.warn('Error sincronizando ranking de corazones:', err);
  }
}

function actualizarTodosLosBotonesDeLikes() {
  fotosActuales.forEach(foto => {
    const total = likesCache.get(foto.id) || 0;
    const yaVotado = misVotosCache.has(foto.id);
    const btnMini = document.getElementById(`btn-like-mini-${foto.id}`);
    const conteoMini = document.getElementById(`conteo-mini-${foto.id}`);
    if (btnMini && conteoMini) {
      conteoMini.textContent = total;
      if (yaVotado) btnMini.classList.add('liked');
      else btnMini.classList.remove('liked');
    }
  });
  actualizarBotonVisor();
}

function actualizarBotonVisor() {
  if (fotosActuales.length === 0) return;
  const foto = fotosActuales[indiceFotoActual];
  if (!foto) return;
  const total = likesCache.get(foto.id) || 0;
  const yaVotado = misVotosCache.has(foto.id);
  const btnVisor = document.getElementById('btn-like-visor');
  const conteoVisor = document.getElementById('conteo-corazones-visor');
  if (btnVisor && conteoVisor) {
    conteoVisor.textContent = total;
    if (yaVotado) btnVisor.classList.add('liked');
    else btnVisor.classList.remove('liked');
  }
}

async function toggleCorazon(fotoId, fotoNombre, event) {
  if (event) event.stopPropagation();
  const yaVotado = misVotosCache.has(fotoId);
  const totalPrevio = likesCache.get(fotoId) || 0;
  const nuevoTotal = yaVotado ? Math.max(0, totalPrevio - 1) : totalPrevio + 1;

  likesCache.set(fotoId, nuevoTotal);
  if (yaVotado) misVotosCache.delete(fotoId);
  else misVotosCache.add(fotoId);

  actualizarTodosLosBotonesDeLikes();

  if (supabaseClient) {
    try {
      const { data: resRpc, error: errRpc } = await supabaseClient.rpc('toggle_corazon', {
        p_foto_id: fotoId,
        p_foto_nombre: fotoNombre || 'Foto',
        p_galeria: 'postales',
        p_huella: HUELLA_USUARIO
      });

      if (!errRpc && resRpc) {
        likesCache.set(fotoId, resRpc.total || 0);
        if (resRpc.liked) misVotosCache.add(fotoId);
        else misVotosCache.delete(fotoId);
        actualizarTodosLosBotonesDeLikes();
        return;
      }

      if (yaVotado) {
        await supabaseClient.from('votos_corazones').delete()
          .eq('foto_id', fotoId).eq('dispositivo_huella', HUELLA_USUARIO);
        await supabaseClient.from('likes_fotos').upsert({
          foto_id: fotoId,
          foto_nombre: fotoNombre,
          galeria: 'postales',
          conteo: nuevoTotal,
          updated_at: new Date().toISOString()
        });
      } else {
        await supabaseClient.from('votos_corazones').insert([{
          foto_id: fotoId,
          dispositivo_huella: HUELLA_USUARIO
        }]);
        await supabaseClient.from('likes_fotos').upsert({
          foto_id: fotoId,
          foto_nombre: fotoNombre,
          galeria: 'postales',
          conteo: nuevoTotal,
          updated_at: new Date().toISOString()
        });
      }
    } catch (err) {
      console.warn('Error guardando like:', err);
    }
  }
}

function toggleCorazonVisor(event) {
  if (fotosActuales.length === 0) return;
  const foto = fotosActuales[indiceFotoActual];
  if (foto) toggleCorazon(foto.id, foto.name, event);
}

// Carga de fotos desde Google Drive con subcarpetas
async function cargarGaleria() {
  const contenedor = document.getElementById('galeria-contenedor');
  contenedor.innerHTML = '<div class="cargando">Cargando colección de Postales...</div>';
  fotosActuales = [];

  try {
    const urlSubcarpetas = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID_GALERIA}'+in+parents+and+mimeType='application/vnd.google-apps.folder'+and+trashed=false&orderBy=name&key=${API_KEY_DRIVE}&fields=files(id,name)`;
    const resSub = await fetch(urlSubcarpetas);
    const dataSub = await resSub.json();
    let subcarpetas = dataSub.files || [];

    if (subcarpetas.length === 0) {
      subcarpetas = [{ id: FOLDER_ID_GALERIA, name: 'Postales' }];
    }

    contenedor.innerHTML = '';

    for (const sub of subcarpetas) {
      const urlFotos = `https://www.googleapis.com/drive/v3/files?q='${sub.id}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&orderBy=name&key=${API_KEY_DRIVE}&pageSize=100&fields=files(id,name)`;
      const resFotos = await fetch(urlFotos);
      const dataFotos = await resFotos.json();

      if (dataFotos.files && dataFotos.files.length > 0) {
        const seccion = document.createElement('section');
        seccion.className = 'seccion-subcarpeta';

        if (sub.id !== FOLDER_ID_GALERIA) {
          const h3 = document.createElement('h3');
          h3.className = 'titulo-subcarpeta';
          h3.innerHTML = `<span class="material-symbols-outlined" style="font-size:18px;">folder_open</span><span>${sub.name}</span>`;
          seccion.appendChild(h3);
        }

        const grid = document.createElement('div');
        grid.className = 'galeria';

        dataFotos.files.forEach(archivo => {
          const fotoObj = {
            id: archivo.id,
            name: archivo.name || 'Fotografía',
            subcarpeta: sub.name,
            urlAlta: `https://lh3.googleusercontent.com/d/${archivo.id}=w1600`,
            urlThumb: `https://lh3.googleusercontent.com/d/${archivo.id}=w800`
          };
          fotosActuales.push(fotoObj);
          const index = fotosActuales.length - 1;

          const wrap = document.createElement('div');
          wrap.className = 'tarjeta-foto-wrap';
          wrap.innerHTML = `
            <img src="${fotoObj.urlThumb}" alt="${fotoObj.name}" loading="lazy" onclick="abrirVisor(${index})"/>
            <button class="btn-like-miniatura" id="btn-like-mini-${fotoObj.id}" onclick="toggleCorazon('${fotoObj.id}', '${fotoObj.name.replace(/'/g, "\\\'")}', event)">
              <span class="material-symbols-outlined">favorite</span>
              <span id="conteo-mini-${fotoObj.id}">0</span>
            </button>
          `;
          grid.appendChild(wrap);
        });

        seccion.appendChild(grid);
        contenedor.appendChild(seccion);
      }
    }

    sincronizarLikesDeGaleria();
  } catch (e) {
    console.error('Error cargando Postales:', e);
    contenedor.innerHTML = '<div class="cargando" style="color:#ef4444;">No se pudieron cargar las fotografías de Google Drive.</div>';
  }
}

// Visor Modal con Registro Activo de Métricas 'foto_visor_hd'
function abrirVisor(index) {
  if (index < 0 || index >= fotosActuales.length) return;
  indiceFotoActual = index;
  const foto = fotosActuales[indiceFotoActual];

  document.getElementById('img-ampliada').src = foto.urlAlta;
  document.getElementById('firma-detalle').textContent = `${foto.subcarpeta} • ${foto.name}`;

  actualizarBotonVisor();
  document.getElementById('modal').style.display = 'flex';

  // ¡CRÍTICO! Registrar la vista de imagen en Supabase para el contador de 'Fotos en Visor HD'
  registrarMetrica('foto_visor_hd', `Foto: #${foto.name} en ${foto.subcarpeta}`, foto.id, foto.subcarpeta);
}

function cerrarVisor() {
  document.getElementById('modal').style.display = 'none';
}

function cerrarVisorFondo(event) {
  if (event.target.id === 'modal') cerrarVisor();
}

function cambiarFoto(dir, event) {
  if (event) event.stopPropagation();
  indiceFotoActual += dir;
  if (indiceFotoActual >= fotosActuales.length) indiceFotoActual = 0;
  else if (indiceFotoActual < 0) indiceFotoActual = fotosActuales.length - 1;
  abrirVisor(indiceFotoActual);
}

document.addEventListener('keydown', (e) => {
  const modal = document.getElementById('modal');
  if (modal.style.display === 'flex') {
    if (e.key === 'Escape') cerrarVisor();
    else if (e.key === 'ArrowLeft') cambiarFoto(-1);
    else if (e.key === 'ArrowRight') cambiarFoto(1);
  }
});

let touchStartX = 0;
let touchEndX = 0;
const modalEl = document.getElementById('modal');
modalEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, false);
modalEl.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  if (touchEndX + 45 < touchStartX) cambiarFoto(1);
  else if (touchEndX > touchStartX + 45) cambiarFoto(-1);
}, false);

// 8. Registro de métricas y visitas reales en Supabase (foto_visor_hd y visita_pagina)
async function registrarMetrica(tipo, detalle, albumId = FOLDER_ID_GALERIA, albumTitulo = 'Postales') {
  if (localStorage.getItem('ignorar_visita') === 'true' ||
      localStorage.getItem('dispositivo_token') === 'sergio_molina_master_device') {
    return;
  }
  try {
    if (!supabaseClient) return;
    const esMovil = /Mobi|Android|iPhone/i.test(navigator.userAgent);
    await supabaseClient.from('visitas').insert([{
      tipo: tipo || 'visita_pagina',
      pagina: 'postales.html',
      album_id: albumId,
      album_titulo: albumTitulo,
      detalle: detalle || 'Visita a galería Postales',
      dispositivo: esMovil ? 'mobile' : 'desktop',
      origen: document.referrer ? (new URL(document.referrer).hostname || 'directo') : 'directo'
    }]);
  } catch (err) {
    console.warn('Registro de métrica omitido o fallido:', err);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  cargarGaleria();
  registrarMetrica('visita_pagina', 'Visita a galería Postales');
});
</script>
