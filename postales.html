<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111111;
      color: #ffffff;
      padding: 16px 12px 36px;
      max-width: 960px;
      margin: 0 auto;
      min-height: 100vh;
      user-select: none;
    }
    body.visor-abierto { overflow: hidden; }

    .cabecera-galeria {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #282828;
    }
    .btn-volver {
      background: #222222;
      color: #ffffff;
      border: 1px solid #005580;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-volver:hover {
      background: #2f2f2f;
      border-color: #38bdf8;
    }
    .titulo-categoria {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
    }

    .titulo-subcarpeta {
      font-size: 0.95rem;
      font-weight: 600;
      color: #38bdf8;
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #222222;
      padding-bottom: 6px;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 600px) {
      .galeria { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    }
    @media (min-width: 768px) {
      .galeria { grid-template-columns: repeat(4, 1fr); gap: 12px; }
    }
    .galeria-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #181818;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #242424;
      cursor: pointer;
    }
    .galeria-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease, opacity 0.25s ease;
      background: #151515;
    }
    .galeria-item:hover img {
      transform: scale(1.03);
      opacity: 0.95;
    }
    .galeria-item:active img {
      transform: scale(0.98);
    }

    /* Pastilla de Likes en Miniatura */
    .badge-likes {
      position: absolute;
      bottom: 8px;
      left: 8px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(14, 14, 14, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
      pointer-events: auto;
    }
    .badge-likes:hover {
      background: rgba(25, 25, 25, 0.9);
      border-color: rgba(244, 63, 94, 0.6);
      transform: scale(1.05);
    }
    .badge-likes.activo {
      border-color: rgba(244, 63, 94, 0.8);
      background: rgba(244, 63, 94, 0.18);
    }
    .badge-likes.activo .icon-corazon {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 20;
      color: #f43f5e;
    }
    .icon-corazon {
      font-size: 15px;
      color: #f43f5e;
      transition: transform 0.15s ease;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
    .badge-likes:active .icon-corazon {
      transform: scale(1.25);
    }

    /* Estado de carga / vacío */
    .cargando-estado, .estado-vacio {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      color: #777777;
      font-size: 0.88rem;
      gap: 12px;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 2px solid #282828;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }
    @keyframes girar {
      to { transform: rotate(360deg); }
    }

    /* Visor Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      touch-action: pan-y;
    }
    .modal-contenido {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 95%;
      max-height: 85vh;
      width: 100%;
      user-select: none;
    }
    .modal-wrapper-img {
      position: relative;
      display: inline-flex;
      max-width: 100%;
      max-height: 85vh;
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.85);
    }
    .modal img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 6px;
      display: block;
      pointer-events: auto;
    }

    .btn-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #ffffff;
      font-size: 1.5rem;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(18, 18, 18, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 50%;
      user-select: none;
      z-index: 2003;
      border: 1px solid rgba(255,255,255,0.22);
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
    }
    .btn-nav:hover {
      background: rgba(0,85,128,0.75);
      border-color: #38bdf8;
    }
    .btn-nav:active {
      background: rgba(0,85,128,0.9);
      transform: translateY(-50%) scale(0.92);
    }
    .btn-prev { left: 16px; }
    .btn-next { right: 16px; }

    .btn-cerrar {
      position: absolute;
      top: 16px;
      right: 16px;
      color: #ffffff;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 2003;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      transition: background 0.2s, transform 0.2s;
    }
    .btn-cerrar:hover {
      background: rgba(255,255,255,0.25);
      transform: scale(1.05);
    }

    /* Firma y Like bilateral en Visor */
    .firma-foto {
      position: absolute;
      bottom: 14px;
      left: 14px;
      z-index: 1002;
      background: rgba(10, 10, 10, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 3px solid #38bdf8;
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
      pointer-events: none;
      max-width: calc(100% - 130px);
    }
    .firma-foto-titulo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.2px;
      color: #ffffff;
    }
    .firma-foto-detalle {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #999999;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-like-visor {
      position: absolute;
      bottom: 14px;
      right: 14px;
      z-index: 1002;
      background: rgba(10, 10, 10, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      pointer-events: auto;
    }
    .btn-like-visor:hover {
      background: rgba(25, 25, 25, 0.95);
      border-color: rgba(244, 63, 94, 0.6);
      transform: scale(1.05);
    }
    .btn-like-visor.activo {
      border-color: rgba(244, 63, 94, 0.8);
      background: rgba(244, 63, 94, 0.22);
    }
    .btn-like-visor.activo .icon-corazon {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 20;
    }

    /* Redes Sociales Oficiales */
    .redes-sociales {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 40px;
    }
    .btn-red {
      background: #222222;
      border-radius: 12px;
      padding: 12px 4px;
      text-align: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-red:active { transform: scale(0.96); }
    .btn-wsp { border: 2px solid #4ade80; color: #4ade80; }
    .btn-cat { border: 2px solid #facc15; color: #facc15; }
    .btn-ig  { border: 2px solid #fb923c; color: #fb923c; }

    footer {
      text-align: center;
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #222222;
      color: #666666;
      font-size: 0.78rem;
      line-height: 1.4;
    }
  </style>
</head>

<script>
    const API_KEY = 'AIzaSyAHNvLODt54qLomj14TUPbQyo-KJ_HO4ZM';
    const FOLDER_ID = '1W-eFu0G6mqggGw6TN7bSU9Dvz0k2h70M';
    const NOMBRE_SECCION = 'Postales';

    // Inicialización del cliente Supabase
    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(
        'https://zbixojacwvanucxlrdcd.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaXhvamFjd3ZhbnVjeGxyZGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzgxMzQsImV4cCI6MjEwNDExNDEzNH0.Wz35IGTGzdHuHOm2EbTsGSLBZfhw67Wt7UXBbMXek68'
      );
    }

    // Identificador único de usuario/navegador para persistencia de votos
    function getVoterId() {
      let vid = localStorage.getItem('srm_voter_id');
      if (!vid) {
        vid = 'voter_' + Math.random().toString(36).substring(2, 12) + '_' + Date.now();
        localStorage.setItem('srm_voter_id', vid);
      }
      return vid;
    }
    const VOTER_ID = getVoterId();

    // Cache local de votos y contadores
    let likesMap = {}; // { [fotoId]: totalLikes }
    let votedSet = new Set(); // Set de IDs de fotos votadas

    try {
      const storedVotes = JSON.parse(localStorage.getItem('srm_voted_photos') || '[]');
      votedSet = new Set(storedVotes);
    } catch (e) {
      votedSet = new Set();
    }

    // Auto-detección del token maestro para exclusión de visitas propias
    const MASTER_TOKEN = 'sergio_molina_master_device';
    const params = new URLSearchParams(window.location.search);
    if (params.get('sergio') === '1' || params.get('admin') === '1' || params.get('ignorar') === '1') {
      try {
        localStorage.setItem('dispositivo_token', MASTER_TOKEN);
        localStorage.setItem('ignorar_visita', 'true');
      } catch (e) {}
      params.delete('sergio');
      params.delete('admin');
      params.delete('ignorar');
      const newQuery = params.toString() ? '?' + params.toString() : '';
      window.history.replaceState({}, document.title, window.location.pathname + newQuery + window.location.hash);
    }

    let fotosActuales = [];
    let indiceFotoActual = 0;

    // Sincronización de likes desde Supabase
    async function sincronizarLikes() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from('likes_fotos')
          .select('foto_id, likes');
        if (!error && data) {
          data.forEach(item => {
            likesMap[item.foto_id] = item.likes || 0;
          });
          actualizarTodosLosBadges();
          actualizarVisorLikeUI();
        }
      } catch (err) {
        console.warn('Sincronización de likes en modo local/fallback', err);
      }
    }

    async function toggleLike(fotoId, event) {
      if (event) event.stopPropagation();
      const yaVoto = votedSet.has(fotoId);

      // Si ya votó, no permite duplicar votos (1 voto único por foto por navegador)
      if (yaVoto) return;

      // Actualizar localmente de inmediato para reactividad fluida
      votedSet.add(fotoId);
      likesMap[fotoId] = (likesMap[fotoId] || 0) + 1;
      try {
        localStorage.setItem('srm_voted_photos', JSON.stringify(Array.from(votedSet)));
      } catch (e) {}

      actualizarBadgeFoto(fotoId);
      actualizarVisorLikeUI();

      // Persistir en Supabase
      if (supabaseClient) {
        try {
          // 1. Guardar voto individual
          await supabaseClient.from('votos_corazones').insert([
            { foto_id: fotoId, voter_id: VOTER_ID, seccion: 'postales' }
          ]);

          // 2. Incrementar o insertar conteo acumulativo en likes_fotos
          const nuevoTotal = likesMap[fotoId];
          await supabaseClient.from('likes_fotos').upsert({
            foto_id: fotoId,
            likes: nuevoTotal,
            seccion: 'postales',
            actualizado_al: new Date().toISOString()
          }, { onConflict: 'foto_id' });
        } catch (err) {
          console.warn('Error al persistir voto:', err);
        }
      }
    }

    function actualizarBadgeFoto(fotoId) {
      const badge = document.querySelector(`.badge-likes[data-foto-id="${fotoId}"]`);
      if (badge) {
        const spanCount = badge.querySelector('.badge-count');
        if (spanCount) spanCount.innerText = likesMap[fotoId] || 0;
        if (votedSet.has(fotoId)) {
          badge.classList.add('activo');
        } else {
          badge.classList.remove('activo');
        }
      }
    }

    function actualizarTodosLosBadges() {
      document.querySelectorAll('.badge-likes').forEach(badge => {
        const id = badge.getAttribute('data-foto-id');
        if (id) {
          const spanCount = badge.querySelector('.badge-count');
          if (spanCount) spanCount.innerText = likesMap[id] || 0;
          if (votedSet.has(id)) {
            badge.classList.add('activo');
          } else {
            badge.classList.remove('activo');
          }
        }
      });
    }

    function actualizarVisorLikeUI() {
      const foto = fotosActuales[indiceFotoActual];
      if (!foto) return;
      const btn = document.getElementById('btn-like-visor');
      const count = document.getElementById('visor-likes-count');
      if (btn && count) {
        count.innerText = likesMap[foto.id] || 0;
        if (votedSet.has(foto.id)) {
          btn.classList.add('activo');
        } else {
          btn.classList.remove('activo');
        }
      }
    }

    async function cargarContenidoDrive() {
      const contenedor = document.getElementById('contenedor-secciones');
      fotosActuales = [];

      try {
        // 1. Consultar subcarpetas dentro del FOLDER_ID
        const urlSubcarpetas = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType='application/vnd.google-apps.folder'+and+trashed=false&orderBy=name&pageSize=100&key=${API_KEY}&fields=files(id,name)`;
        const resFolders = await fetch(urlSubcarpetas);
        const dataFolders = await resFolders.json();
        const subcarpetas = (dataFolders && dataFolders.files) ? dataFolders.files : [];

        // 2. Consultar fotos en la raíz de la carpeta Postales
        const urlFotosRaiz = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&orderBy=name&pageSize=200&key=${API_KEY}&fields=files(id,name)`;
        const resRaiz = await fetch(urlFotosRaiz);
        const dataRaiz = await resRaiz.json();
        const fotosRaiz = (dataRaiz && dataRaiz.files) ? dataRaiz.files : [];

        contenedor.innerHTML = '';
        let totalFotosCargadas = 0;

        // Renderizar fotos de la raíz si existen
        if (fotosRaiz.length > 0) {
          renderizarGrupoFotos(contenedor, NOMBRE_SECCION, fotosRaiz);
          totalFotosCargadas += fotosRaiz.length;
        }

        // Renderizar cada subcarpeta
        for (const sub of subcarpetas) {
          const urlSubFotos = `https://www.googleapis.com/drive/v3/files?q='${sub.id}'+in+parents+and+mimeType+contains+'image/'+and+trashed=false&orderBy=name&pageSize=200&key=${API_KEY}&fields=files(id,name)`;
          try {
            const resSub = await fetch(urlSubFotos);
            const dataSub = await resSub.json();
            if (dataSub.files && dataSub.files.length > 0) {
              renderizarGrupoFotos(contenedor, sub.name, dataSub.files);
              totalFotosCargadas += dataSub.files.length;
            }
          } catch (e) {
            console.error(`Error al cargar subcarpeta ${sub.name}:`, e);
          }
        }

        if (totalFotosCargadas === 0) {
          contenedor.innerHTML = `
            <div class="estado-vacio">
              <span class="material-symbols-outlined" style="font-size: 32px; color: #444;">image_not_supported</span>
              <p>No se encontraron fotografías en la carpeta de Google Drive.</p>
            </div>
          `;
        }

        // Una vez renderizadas las fotos, sincronizar likes de la base de datos
        sincronizarLikes();

      } catch (err) {
        console.error('Error al consultar Google Drive:', err);
        contenedor.innerHTML = `
          <div class="estado-vacio">
            <span class="material-symbols-outlined" style="font-size: 32px; color: #ef4444;">error_outline</span>
            <p>No se pudieron sincronizar las fotos desde Google Drive. Verifique la conexión.</p>
          </div>
        `;
      }
    }

    function renderizarGrupoFotos(contenedor, tituloGrupo, archivos) {
      const seccion = document.createElement('section');
      
      const headerHtml = `
        <h3 class="titulo-subcarpeta">
          <span class="material-symbols-outlined" style="font-size: 18px;">folder</span>
          <span>${tituloGrupo}</span>
        </h3>
      `;
      seccion.innerHTML = headerHtml;

      const grid = document.createElement('div');
      grid.className = 'galeria';

      archivos.forEach(file => {
        const urlHD = `https://lh3.googleusercontent.com/d/${file.id}=w1600`;
        const urlMiniatura = `https://lh3.googleusercontent.com/d/${file.id}=w800`;
        const indice = fotosActuales.length;

        fotosActuales.push({
          id: file.id,
          name: file.name || 'foto.jpg',
          url: urlHD,
          subcarpeta: tituloGrupo
        });

        const item = document.createElement('div');
        item.className = 'galeria-item';

        const img = document.createElement('img');
        img.src = urlMiniatura;
        img.alt = file.name || 'Postal';
        img.loading = 'lazy';
        img.onerror = () => { item.style.display = 'none'; };
        item.onclick = () => abrirVisor(indice);

        // Pastilla sutil interactiva de likes en la esquina inferior izquierda
        const likesBadge = document.createElement('div');
        likesBadge.className = 'badge-likes' + (votedSet.has(file.id) ? ' activo' : '');
        likesBadge.setAttribute('data-foto-id', file.id);
        likesBadge.innerHTML = `
          <span class="material-symbols-outlined icon-corazon">favorite</span>
          <span class="badge-count">${likesMap[file.id] || 0}</span>
        `;
        likesBadge.onclick = (e) => toggleLike(file.id, e);

        item.appendChild(img);
        item.appendChild(likesBadge);
        grid.appendChild(item);
      });

      seccion.appendChild(grid);
      contenedor.appendChild(seccion);
    }

    /* Visor Modal */
    function abrirVisor(index) {
      if (!fotosActuales.length) return;
      if (index >= fotosActuales.length) index = 0;
      if (index < 0) index = fotosActuales.length - 1;

      indiceFotoActual = index;
      actualizarContenidoVisor();

      document.getElementById('modal').style.display = 'flex';
      document.body.classList.add('visor-abierto');

      const foto = fotosActuales[indiceFotoActual];
      if (foto) {
        registrarMetrica('foto_visor_hd', `Foto: #${foto.name} en ${foto.subcarpeta}`);
      }
    }

    function actualizarContenidoVisor() {
      const foto = fotosActuales[indiceFotoActual];
      if (!foto) return;

      const img = document.getElementById('img-ampliada');
      img.src = foto.url;
      img.alt = foto.name;

      const subcarpetaElem = document.getElementById('firma-subcarpeta');
      if (subcarpetaElem) subcarpetaElem.innerText = foto.subcarpeta || NOMBRE_SECCION;

      const archivoElem = document.getElementById('firma-archivo');
      if (archivoElem) archivoElem.innerText = '#' + (foto.name || 'foto.jpg');

      actualizarVisorLikeUI();
    }

    function cerrarVisor() {
      document.getElementById('modal').style.display = 'none';
      document.body.classList.remove('visor-abierto');
    }

    function cambiarFoto(dir) {
      if (fotosActuales.length === 0) return;
      indiceFotoActual += dir;
      if (indiceFotoActual >= fotosActuales.length) indiceFotoActual = 0;
      else if (indiceFotoActual < 0) indiceFotoActual = fotosActuales.length - 1;
      actualizarContenidoVisor();
    }

    // Botón Like en el Visor
    document.getElementById('btn-like-visor').addEventListener('click', e => {
      e.stopPropagation();
      const foto = fotosActuales[indiceFotoActual];
      if (foto) toggleLike(foto.id, e);
    });

    // Eventos del Visor
    document.getElementById('btn-cerrar-modal').addEventListener('click', e => {
      e.stopPropagation();
      cerrarVisor();
    });

    document.getElementById('btn-prev-modal').addEventListener('click', e => {
      e.stopPropagation();
      cambiarFoto(-1);
    });

    document.getElementById('btn-next-modal').addEventListener('click', e => {
      e.stopPropagation();
      cambiarFoto(1);
    });

    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal' || e.target.id === 'modal-touch-area') {
        cerrarVisor();
      }
    });

    document.addEventListener('keydown', e => {
      const modal = document.getElementById('modal');
      if (modal && modal.style.display === 'flex') {
        if (e.key === 'Escape') cerrarVisor();
        else if (e.key === 'ArrowLeft') cambiarFoto(-1);
        else if (e.key === 'ArrowRight') cambiarFoto(1);
      }
    });

    // Deslizamiento táctil (swipe)
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    const modalTouch = document.getElementById('modal');

    modalTouch.addEventListener('touchstart', e => {
      if (e.touches && e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchEndX = touchStartX;
        touchEndY = touchStartY;
      }
    }, { passive: true });

    modalTouch.addEventListener('touchmove', e => {
      if (e.touches && e.touches.length > 0) {
        touchEndX = e.touches[0].clientX;
        touchEndY = e.touches[0].clientY;
      }
    }, { passive: true });

    modalTouch.addEventListener('touchend', () => {
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) {
          cambiarFoto(1);
        } else {
          cambiarFoto(-1);
        }
      }
    }, { passive: true });

    // Exclusión de Dispositivos Propios y Registro de Visitas
    async function esDispositivoIgnorado(client) {
      try {
        if (localStorage.getItem('ignorar_visita') === 'true') return true;
        if (localStorage.getItem('dispositivo_token') === MASTER_TOKEN) return true;
        if (sessionStorage.getItem('admin_auth') === 'true') return true;

        const tokenLocal = localStorage.getItem('dispositivo_token');
        if (tokenLocal && client) {
          const { data, error } = await client
            .from('dispositivos_ignorados')
            .select('token')
            .eq('token', tokenLocal)
            .maybeSingle();

          if (!error && data && data.token) {
            localStorage.setItem('ignorar_visita', 'true');
            return true;
          }
        }
      } catch (err) {}
      return false;
    }

    async function registrarMetrica(tipo, detalle) {
      try {
        if (!supabaseClient) return;

        const ignorar = await esDispositivoIgnorado(supabaseClient);
        if (ignorar) {
          return;
        }

        const dispositivo = window.innerWidth < 640 ? 'mobile' : (window.innerWidth < 1024 ? 'tablet' : 'desktop');
        const origen = document.referrer ? document.referrer : 'directo';

        await supabaseClient.from('visitas').insert([
          {
            tipo: tipo || 'visita_pagina',
            pagina: 'postales.html',
            detalle: detalle || 'Galería Postales',
            dispositivo: dispositivo,
            origen: origen
          }
        ]);
      } catch (_) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarContenidoDrive();
      registrarMetrica('visita_pagina', 'Galería Postales');
    });
  </script>
</body></html>
