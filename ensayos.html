<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

    header {

    }
    .btn-volver {

      padding: 8px 16px;

    }
    .btn-volver:hover {

    }
    .titulo-categoria {
      font-size: 1.3rem;

      align-items: center;

    }

    }
    .seccion-subcarpeta {
      margin-bottom: 34px;
    }
    .subcarpeta-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      padding-bottom: 6px;
    }
    .subcarpeta-titulo {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .contador-badge {
      font-size: 0.75rem;

      font-family: monospace;
      margin-left: auto;
    }
    .galeria {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 600px) {
      .galeria { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    }
    @media (min-width: 768px) {
      .galeria { grid-template-columns: repeat(4, 1fr); gap: 12px; }
    }
    .card-foto {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #1c1c1c;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card-foto:hover {
      transform: scale(1.02);
      border-color: #0077b3;
    }
    .card-foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.3s ease;
    }
    .spinner-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 1;
      pointer-events: none;
    }
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes spin-center {
      to { transform: rotate(360deg); }
    }
    .badge-likes-thumb {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(18, 18, 18, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffffff;
      z-index: 5;
      cursor: pointer;

    }
    .badge-likes-thumb.liked {

    .modal {

    .firma-visor {

      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;

    }
    .firma-visor .material-symbols-outlined { font-size: 15px; color: #38bdf8; }
    .btn-like-visor {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      z-index: 2003;
      transition: all 0.2s ease;
      user-select: none;
    }
    .btn-like-visor.liked {
      background: rgba(225, 29, 72, 0.35);
      border-color: #fb7185;
      color: #fb7185;
    }
    .btn-like-visor .material-symbols-outlined { font-size: 18px; }
    .btn-like-visor.liked .material-symbols-outlined {
      font-variation-settings: 'FILL' 1;

    }
    .btn-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 2rem;
      padding: 14px 18px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      user-select: none;
      z-index: 2001;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: background 0.2s, transform 0.2s;
    }
    .btn-nav:hover { background: rgba(0, 85, 128, 0.75); transform: translateY(-50%) scale(1.08); }
    .btn-prev { left: 16px; }
    .btn-next { right: 16px; }
    .btn-cerrar {
      position: absolute;
      top: 20px;
      right: 24px;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      z-index: 2004;
      padding: 4px 14px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      line-height: 1;
      transition: background 0.2s;
    }
    .btn-cerrar:hover { background: rgba(255, 255, 255, 0.25); }
    .redes-sociales {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 36px;
    }
    .btn-red {
      background: #222222;
      border-radius: 12px;
      padding: 14px 6px;
      text-align: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-red:active { transform: scale(0.96); background: #2a2a2a; }
    .btn-wsp { border: 2px solid #4ade80; color: #4ade80; }
    .btn-cat { border: 2px solid #facc15; color: #facc15; }
    .btn-ig  { border: 2px solid #fb923c; color: #fb923c; }
    footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #222222;
      color: #666666;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }
    .cargando-contenedor {
      text-align: center;
      color: #aaaaaa;
      padding: 60px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .spinner-principal {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin-center 0.8s linear infinite;
    }
    @media (max-width: 640px) {
      .btn-nav { display: none; }
      .firma-visor { font-size: 0.7rem; padding: 4px 8px; left: 8px; bottom: 8px; }
      .btn-like-visor { font-size: 0.78rem; padding: 6px 10px; right: 8px; bottom: 8px; }
    }
  </style>
</head>

<script>
    const API_KEY = 'AIzaSyAHNvLODt54qLomj14TUPbQyo-KJ_HO4ZM';
    const FOLDER_ID = '1K4h3SPq2WdCEMMzrTSToD-quebXDD4rS'; // ID de Ensayos
    const NOMBRE_SECCION = 'Ensayos';

    const SUPABASE_URL = 'https://zbixojacwvanucxlrdcd.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaXhvamFjd3ZhbnVjeGxyZGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzgxMzQsImV4cCI6MjEwNDExNDEzNH0.Wz35IGTGzdHuHOm2EbTsGSLBZfhw67Wt7UXBbMXek68';

    const supabase = (window.supabase && typeof window.supabase.createClient === 'function')
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    function getFingerprint() {
      let fp = localStorage.getItem('user_fingerprint');
      if (!fp) {
        fp = 'fp_' + Math.random().toString(36).substring(2, 12) + '_' + Date.now();
        localStorage.setItem('user_fingerprint', fp);
      }
      return fp;
    }
    const HUELLA_USUARIO = getFingerprint();

    let fotosActuales = [];
    let indiceFotoActual = 0;
    let votosLocales = JSON.parse(localStorage.getItem('votos_ensayos') || '{}');
    let likesMemoria = {};

    // Carga de Likes asíncrona sin bloquear renderizado
    async function cargarLikesDesdeSupabase() {
      if (!supabase) return;
      try {
        const { data, error } = await supabase
          .from('likes_fotos')
          .select('foto_id, conteo')
          .eq('galeria', 'ensayos');
        if (!error && data) {
          data.forEach(item => { likesMemoria[item.foto_id] = item.conteo; });
          actualizarTodosLosBadges();
        }
      } catch (_) {}
    }

    async function toggleLikeFoto(fotoId, fotoNombre, e) {
      if (e) { e.stopPropagation(); e.preventDefault(); }
      const yaVoto = !!votosLocales[fotoId];
      const conteoActual = likesMemoria[fotoId] || 0;
      const nuevoConteo = yaVoto ? Math.max(0, conteoActual - 1) : conteoActual + 1;

      likesMemoria[fotoId] = nuevoConteo;
      if (yaVoto) delete votosLocales[fotoId];
      else votosLocales[fotoId] = true;
      localStorage.setItem('votos_ensayos', JSON.stringify(votosLocales));

      actualizarBadgeFoto(fotoId, nuevoConteo, !yaVoto);
      if (fotosActuales[indiceFotoActual] && fotosActuales[indiceFotoActual].id === fotoId) {
        actualizarBotonVisor(nuevoConteo, !yaVoto);
      }

      if (supabase) {
        try {
          const { data } = await supabase.rpc('toggle_corazon', {
            p_foto_id: fotoId,
            p_foto_nombre: fotoNombre || 'foto.jpg',
            p_galeria: 'ensayos',
            p_huella: HUELLA_USUARIO
          });
          if (data) {
            likesMemoria[fotoId] = data.total;
            if (data.liked) votosLocales[fotoId] = true;
            else delete votosLocales[fotoId];
            localStorage.setItem('votos_ensayos', JSON.stringify(votosLocales));
            actualizarBadgeFoto(fotoId, data.total, data.liked);
            if (fotosActuales[indiceFotoActual] && fotosActuales[indiceFotoActual].id === fotoId) {
              actualizarBotonVisor(data.total, data.liked);
            }
          }
        } catch (_) {}
      }
    }

    function toggleCorazonVisor(e) {
      if (!fotosActuales[indiceFotoActual]) return;
      const f = fotosActuales[indiceFotoActual];
      toggleLikeFoto(f.id, f.nombre, e);
    }

    function actualizarBadgeFoto(fotoId, conteo, isLiked) {
      const badge = document.getElementById('badge-like-' + fotoId);
      const txt = document.getElementById('txt-like-' + fotoId);
      if (txt) txt.textContent = conteo;
      if (badge) {
        if (isLiked) badge.classList.add('liked');
        else badge.classList.remove('liked');
      }
    }

    function actualizarTodosLosBadges() {
      Object.keys(likesMemoria).forEach(fotoId => {
        actualizarBadgeFoto(fotoId, likesMemoria[fotoId], !!votosLocales[fotoId]);
      });
    }

    function actualizarBotonVisor(conteo, isLiked) {
      const btn = document.getElementById('btn-like-visor');
      const txt = document.getElementById('txt-like-visor');
      if (txt) txt.textContent = conteo;
      if (btn) {
        if (isLiked) btn.classList.add('liked');
        else btn.classList.remove('liked');
      }
    }

    // MOTOR EXACTO DE CARGA DE GOOGLE DRIVE (IDÉNTICO A MISCELANEAS.HTML)
    async function cargarFotosDrive() {
      const contenedor = document.getElementById('contenedor-secciones');
      fotosActuales = [];

      try {
        const urlRaiz = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&orderBy=name&key=${API_KEY}&fields=files(id,name,mimeType)`;
        const resRaiz = await fetch(urlRaiz);
        const dataRaiz = await resRaiz.json();
        const archivosRaiz = dataRaiz.files || [];

        const subcarpetas = archivosRaiz.filter(item => item.mimeType === 'application/vnd.google-apps.folder');
        const esImagen = item => (item.mimeType && item.mimeType.startsWith('image/')) || /\.(jpe?g|png|webp|heic|cr2|cr3|nef|raw)$/i.test(item.name);
        const fotosDirectas = archivosRaiz.filter(esImagen);

        contenedor.innerHTML = '';

        if (subcarpetas.length === 0 && fotosDirectas.length === 0) {
          contenedor.innerHTML = '<div class="cargando-contenedor"><p>No se encontraron fotografías disponibles en esta carpeta de Google Drive.</p></div>';
          return;
        }

        if (fotosDirectas.length > 0) {
          renderizarGrupo(contenedor, subcarpetas.length > 0 ? 'Fotografías Generales' : '', fotosDirectas);
        }

        if (subcarpetas.length > 0) {
          for (const sub of subcarpetas) {
            try {
              const urlSub = `https://www.googleapis.com/drive/v3/files?q='${sub.id}'+in+parents+and+trashed=false&orderBy=name&key=${API_KEY}&fields=files(id,name,mimeType)`;
              const resSub = await fetch(urlSub);
              const dataSub = await resSub.json();
              const fotosSub = (dataSub.files || []).filter(esImagen);

              if (fotosSub.length > 0) {
                renderizarGrupo(contenedor, sub.name, fotosSub);
              }
            } catch (errSub) {
              console.warn('Error leyendo subcarpeta:', sub.name, errSub);
            }
          }
        }

        // Cargar likes después de renderizar sin trabar la UI
        cargarLikesDesdeSupabase();

      } catch (err) {
        console.error('Error al explorar Google Drive:', err);
        contenedor.innerHTML = '<div class="cargando-contenedor"><p style="color:#ef4444;">Error al conectar con Google Drive. Verificá los permisos públicos de la carpeta.</p></div>';
      }
    }

    function renderizarGrupo(contenedorPadre, tituloCarpeta, listaArchivos) {
      const seccion = document.createElement('section');
      seccion.className = 'seccion-subcarpeta';

      if (tituloCarpeta) {
        const header = document.createElement('div');
        header.className = 'subcarpeta-header';
        header.innerHTML = `
          <h2 class="subcarpeta-titulo">
            <span class="material-symbols-outlined">folder</span>
            <span>${tituloCarpeta}</span>
          </h2>
          <span class="contador-badge">${listaArchivos.length} ${listaArchivos.length === 1 ? 'foto' : 'fotos'}</span>
        `;
        seccion.appendChild(header);
      }

      const grid = document.createElement('div');
      grid.className = 'galeria';

      listaArchivos.forEach(archivo => {
        const urlHD = `https://lh3.googleusercontent.com/d/${archivo.id}=w1600`;
        const urlThumb = `https://lh3.googleusercontent.com/d/${archivo.id}=w800`;
        const indexFoto = fotosActuales.length;

        fotosActuales.push({
          id: archivo.id,
          nombre: archivo.name || 'foto.jpg',
          subcarpeta: tituloCarpeta || NOMBRE_SECCION,
          url: urlHD
        });

        const card = document.createElement('div');
        card.className = 'card-foto';
        card.onclick = () => abrirVisor(indexFoto);

        const conteo = likesMemoria[archivo.id] || 0;
        const liked = !!votosLocales[archivo.id];

        card.innerHTML = `
          <div class="spinner-card" id="spinner-${archivo.id}"></div>
          <img src="${urlThumb}" alt="${archivo.name}" loading="lazy" onload="document.getElementById('spinner-${archivo.id}')?.remove();" onerror="document.getElementById('spinner-${archivo.id}')?.remove();">
          <button class="badge-likes-thumb ${liked ? 'liked' : ''}" id="badge-like-${archivo.id}" onclick="toggleLikeFoto('${archivo.id}', '${archivo.name}', event)" type="button" title="Me gusta">
            <span class="material-symbols-outlined">favorite</span>
            <span id="txt-like-${archivo.id}">${conteo}</span>
          </button>
        `;

        grid.appendChild(card);
      });

      seccion.appendChild(grid);
      contenedorPadre.appendChild(seccion);
    }

    function abrirVisor(index) {
      if (!fotosActuales[index]) return;
      indiceFotoActual = index;
      const f = fotosActuales[indiceFotoActual];

      document.getElementById('img-ampliada').src = f.url;
      document.getElementById('texto-firma').textContent = `Sergio Molina • ${f.subcarpeta} • #${f.nombre}`;

      const conteo = likesMemoria[f.id] || 0;
      const liked = !!votosLocales[f.id];
      actualizarBotonVisor(conteo, liked);

      document.body.classList.add('visor-abierto');
      document.getElementById('modal').style.display = 'flex';
      registrarMetrica('foto_visor_hd', `Foto: #${f.nombre} en ${f.subcarpeta}`);
    }

    function cerrarVisor() {
      document.getElementById('modal').style.display = 'none';
      document.body.classList.remove('visor-abierto');
    }
    
    function cerrarVisorFondo(e) {
      if (e.target.id === 'modal') cerrarVisor();
    }

    function cambiarFoto(dir, event) {
      if (event) event.stopPropagation();
      if (fotosActuales.length === 0) return;
      indiceFotoActual += dir;
      if (indiceFotoActual >= fotosActuales.length) indiceFotoActual = 0;
      else if (indiceFotoActual < 0) indiceFotoActual = fotosActuales.length - 1;

      const f = fotosActuales[indiceFotoActual];
      if (f) {
        document.getElementById('img-ampliada').src = f.url;
        document.getElementById('texto-firma').textContent = `Sergio Molina • ${f.subcarpeta} • #${f.nombre}`;
        const conteo = likesMemoria[f.id] || 0;
        const liked = !!votosLocales[f.id];
        actualizarBotonVisor(conteo, liked);
      }
    }

    document.addEventListener('keydown', e => {
      const m = document.getElementById('modal');
      if (m && m.style.display === 'flex') {
        if (e.key === 'Escape') cerrarVisor();
        else if (e.key === 'ArrowLeft') cambiarFoto(-1);
        else if (e.key === 'ArrowRight') cambiarFoto(1);
      }
    });

    let touchStartX = 0;
    const modalEl = document.getElementById('modal');
    modalEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    modalEl.addEventListener('touchend', e => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX + 45 < touchStartX) cambiarFoto(1);
      else if (touchEndX > touchStartX + 45) cambiarFoto(-1);
    }, { passive: true });

    // REGISTRADOR DE MÉTRICAS (EXCLUSOR DESACTIVADO POR DEFECTO)
    async function registrarMetrica(tipo, detalle) {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('sergio') === '1') {
          localStorage.setItem('ignorar_visita', 'true');
          localStorage.setItem('dispositivo_token', 'sergio_molina_master_device');
        }

        if (localStorage.getItem('ignorar_visita') === 'true') {
          return;
        }

        if (supabase) {
          await supabase.from('visitas').insert([{
            tipo,
            pagina: 'ensayos.html',
            detalle,
            dispositivo: window.innerWidth < 640 ? 'mobile' : 'desktop',
            origen: document.referrer ? (new URL(document.referrer).hostname || 'directo') : 'directo'
          }]);
        }
      } catch (_) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarFotosDrive();
      registrarMetrica('visita_pagina', 'Visita a galería Ensayos');
    });
  </script>
</body></html>
